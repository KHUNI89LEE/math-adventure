<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c5cff" />
  <meta name="description" content="만 4세부터 즐기는 그림·애니메이션 중심 수학 놀이터 - 같아요와 방정식 개념 포함" />
  <title>콩콩 수학 놀이터</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=10.0" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="round-btn" id="homeBtn" aria-label="홈">🏡</button>
      <div class="brand">
        <span class="brand-star">✨</span>
        <div>
          <h1>콩콩 수학 놀이터</h1>
          <p>놀다 보면 수학이 보여요!</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="pill" id="soundBtn" aria-label="소리 켜기/끄기">🔊</button>
        <button class="pill reward-pill" id="rewardBtn" aria-label="별 보기">⭐ <span id="starCount">0</span></button>
      </div>
    </header>

    <main id="main">
      <section id="homeScreen" class="screen active">
        <div class="hero">
          <div class="hero-text">
            <span class="eyebrow">오늘은 어디에서 놀까?</span>
            <h2>나만의 수학 마을</h2>
            <p>건물을 눌러서 움직이고, 나누고, 맞춰 보세요.</p>
          </div>
          <div class="mascot" aria-hidden="true">
            <div class="mascot-ear left"></div>
            <div class="mascot-ear right"></div>
            <div class="mascot-face">
              <span class="eye left"></span><span class="eye right"></span>
              <span class="mouth">ᴗ</span>
            </div>
          </div>
        </div>

        <div class="village">
          <button class="place place-train" data-place="train">
            <span class="float-cloud c1">☁️</span>
            <span class="place-emoji">🚂</span>
            <strong>기차역</strong>
            <small>더하기 · 빼기</small>
          </button>

          <button class="place place-pizza" data-place="pizza">
            <span class="place-emoji">🍕</span>
            <strong>피자 가게</strong>
            <small>나누기 · 분수</small>
          </button>

          <button class="place place-farm" data-place="farm">
            <span class="place-emoji">🐥</span>
            <strong>동물 농장</strong>
            <small>곱하기 · 묶음</small>
          </button>

          <button class="place place-pattern" data-place="pattern">
            <span class="place-emoji">🌈</span>
            <strong>무지개 정원</strong>
            <small>규칙 · 추론</small>
          </button>

          <button class="place place-block" data-place="block">
            <span class="place-emoji">🧱</span>
            <strong>블록 연구소</strong>
            <small>공간 · 비교</small>
          </button>

          <button class="place place-market" data-place="market">
            <span class="place-emoji">🛒</span>
            <strong>동전 마트</strong>
            <small>돈 · 계산</small>
          </button>

          <button class="place place-balance" data-place="balance">
            <span class="place-emoji">⚖️</span>
            <strong>같아요 연구소</strong>
            <small>같음 · 균형 · 숨은 수</small>
          </button>

          <div class="village-ground">
            <span>🌼</span><span>🌳</span><span>🌷</span><span>🦋</span><span>🌻</span>
          </div>
        </div>

        <section class="daily-card">
          <div>
            <span class="badge">오늘의 놀이</span>
            <h3 id="dailyTitle">기차에 동물 친구를 태워 주세요!</h3>
          </div>
          <button class="primary" id="dailyStart">바로 놀기</button>
        </section>
      </section>

      <section id="activityScreen" class="screen">
        <div class="activity-head">
          <div class="activity-nav"><button class="back-btn" id="backBtn">← 마을로</button><button class="refresh-btn" id="refreshBtn">🔄 새 문제</button></div>
          <div>
            <span id="activityBadge" class="badge">놀이</span>
            <h2 id="activityTitle">활동</h2>
            <p id="activitySubtitle"></p>
          </div>
        </div>
        <div id="activityStage" class="activity-stage"></div>
      </section>

      <section id="rewardScreen" class="screen">
        <div class="reward-screen-card">
          <button class="back-btn" id="rewardBackBtn">← 돌아가기</button>
          <div class="trophy">🏆</div>
          <h2>내가 모은 별</h2>
          <div class="big-stars"><span id="rewardStars">0</span> ⭐</div>
          <p>별을 모으면 수학 마을이 더 반짝여요.</p>
          <div class="sticker-grid" id="stickerGrid"></div>
          <button class="reset-stars-btn" id="resetStarsBtn">별과 스티커 초기화</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js?v=10.0"></script>
</body>
</html>
